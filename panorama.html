<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panorama</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#10151a; overflow:hidden; }
  #wrap {
    width:100%; height:100%; position:relative; cursor:grab;
    touch-action:none;
  }
  #wrap.grabbing { cursor:grabbing; }
  #img {
    position:absolute; top:0; left:0;
    transform-origin:0 0;
    user-select:none; -webkit-user-drag:none;
  }
  #msg {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#8ea3ab; font-family:sans-serif; font-size:0.95rem; text-align:center; padding:2rem;
    white-space:pre-line; pointer-events:none; gap:1rem;
  }
  #progress-track {
    width:min(320px, 80vw); height:6px; border-radius:3px;
    background:#1a2229; overflow:hidden;
  }
  #progress-bar {
    height:100%; width:0%; background:#ff8a4c; transition:width .15s ease;
  }
  #controls {
    position:fixed; bottom:1rem; right:1rem; display:flex; gap:0.5rem; z-index:10;
  }
  #controls button {
    width:2.2rem; height:2.2rem; border-radius:6px; border:1px solid #2a343b;
    background:#1a2229; color:#eef2f0; font-size:1.1rem; cursor:pointer;
  }
  #controls button:hover { border-color:#4fb6c9; }
  #hint {
    position:fixed; top:1rem; left:50%; transform:translateX(-50%);
    background:rgba(16,21,26,0.85); color:#8ea3ab; font-family:sans-serif; font-size:0.78rem;
    padding:0.4rem 0.8rem; border-radius:6px; pointer-events:none; z-index:10;
  }
  #title {
    position:fixed; top:1rem; left:1rem; z-index:10;
    color:#eef2f0; font-family:'Georgia',serif; font-size:1.15rem; font-weight:600;
    background:rgba(16,21,26,0.7); padding:0.4rem 0.8rem; border-radius:6px;
    max-width:60vw; pointer-events:none; display:none;
  }
</style>
</head>
<body>
<div id="title"></div>
<div id="msg">
  <div>Lade Panorama&hellip;</div>
  <div id="progress-track"><div id="progress-bar"></div></div>
  <div id="progress-text" style="font-size:0.78rem;"></div>
</div>
<div id="hint" style="display:none">Ziehen zum Verschieben &middot; Scrollen/Pinch zum Zoomen</div>
<div id="wrap">
  <img id="img" draggable="false">
</div>
<div id="controls" style="display:none">
  <button id="zoomOut">&minus;</button>
  <button id="zoomFit">&#9633;</button>
  <button id="zoomIn">+</button>
</div>

<script>
/*
  Aufruf:
  panorama.html?commons=Falknisspitz_Panorama.jpg          -> volle Original-Auflösung von Commons
  panorama.html?commons=Falknis_Panorama.jpg&title=Falknis  -> mit eigenem Titel oben links
  panorama.html?img=<Bild-URL>                              -> beliebige andere direkt erreichbare Bild-URL
*/

const params = new URLSearchParams(location.search);
const commonsFile = params.get('commons');
const imgParam = params.get('img');
const titleParam = params.get('title');
const msg = document.getElementById('msg');
const progressBar = document.getElementById('progress-bar');
const progressText = document.getElementById('progress-text');
const titleEl = document.getElementById('title');
const hint = document.getElementById('hint');
const controls = document.getElementById('controls');
const wrap = document.getElementById('wrap');
const img = document.getElementById('img');

let scale = 1, minScale = 0.05, maxScale = 8;
let originX = 0, originY = 0;
let naturalW = 0, naturalH = 0;

function deriveTitle(commons, imgUrl) {
  if (titleParam) return titleParam;
  let base = commons || (imgUrl ? imgUrl.split('/').pop() : '');
  base = decodeURIComponent(base).replace(/\.(jpg|jpeg|png|tiff?)$/i, '');
  base = base.replace(/[_\s]*panorama.*$/i, '');
  base = base.replace(/_/g, ' ').trim();
  return base;
}

function showTitle(text) {
  if (!text) return;
  titleEl.innerText = text;
  titleEl.style.display = 'block';
}

function applyTransform() {
  img.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`;
}

function initialView() {
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  scale = (wh * 0.875) / naturalH;
  minScale = Math.min(scale * 0.3, ww / naturalW);
  maxScale = Math.max(8, scale * 20);
  originX = (ww - naturalW * scale) / 2;
  originY = (wh - naturalH * scale) / 2;
  applyTransform();
}

function fitToScreen() {
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  const scaleX = ww / naturalW, scaleY = wh / naturalH;
  scale = Math.min(scaleX, scaleY);
  originX = (ww - naturalW * scale) / 2;
  originY = (wh - naturalH * scale) / 2;
  applyTransform();
}

function onImageReady() {
  naturalW = img.naturalWidth;
  naturalH = img.naturalHeight;
  img.style.width = naturalW + 'px';
  img.style.height = naturalH + 'px';
  msg.style.display = 'none';
  hint.style.display = 'block';
  controls.style.display = 'flex';
  initialView();
}

function fail(text) {
  msg.querySelector('div').innerText = text;
  document.getElementById('progress-track').style.display = 'none';
  progressText.innerText = '';
}

function setProgress(loaded, total) {
  if (total > 0) {
    const pct = Math.min(100, Math.round(loaded / total * 100));
    progressBar.style.width = pct + '%';
    progressText.innerText = pct + '% (' + (loaded/1e6).toFixed(1) + ' / ' + (total/1e6).toFixed(1) + ' MB)';
  } else {
    progressText.innerText = (loaded/1e6).toFixed(1) + ' MB geladen\u2026';
  }
}

function loadImage(url) {
  fetch(url)
    .then(resp => {
      if (!resp.ok || !resp.body) throw new Error('bad response');
      const total = parseInt(resp.headers.get('Content-Length') || '0', 10);
      const reader = resp.body.getReader();
      let loaded = 0;
      const chunks = [];
      function pump() {
        return reader.read().then(({ done, value }) => {
          if (done) {
            const blob = new Blob(chunks);
            img.onload = onImageReady;
            img.src = URL.createObjectURL(blob);
            return;
          }
          chunks.push(value);
          loaded += value.length;
          setProgress(loaded, total);
          return pump();
        });
      }
      return pump();
    })
    .catch(() => {
      // Fallback: plain image load without progress tracking (e.g. if streaming/CORS headers unavailable)
      img.onload = onImageReady;
      img.onerror = function () {
        fail('Bild konnte nicht geladen werden.\nURL prüfen (muss öffentlich erreichbar sein).');
      };
      img.src = url;
    });
}

if (commonsFile) {
  showTitle(deriveTitle(commonsFile, null));
  const apiUrl = 'https://commons.wikimedia.org/w/api.php?action=query&titles=' +
    encodeURIComponent('File:' + commonsFile) +
    '&prop=imageinfo&iiprop=url&format=json&origin=*';
  fetch(apiUrl)
    .then(r => r.json())
    .then(data => {
      const pages = data.query && data.query.pages;
      const page = pages && Object.values(pages)[0];
      const info = page && page.imageinfo && page.imageinfo[0];
      if (!info) {
        fail('Datei "' + commonsFile + '" wurde auf Wikimedia Commons nicht gefunden.');
        return;
      }
      loadImage(info.url);
    })
    .catch(() => fail('Wikimedia-API konnte nicht erreicht werden.'));
} else if (imgParam) {
  showTitle(deriveTitle(null, imgParam));
  loadImage(imgParam);
} else {
  fail('Kein Bild angegeben.\nAufruf: panorama.html?commons=DATEINAME.jpg\noder: panorama.html?img=BILD_URL');
}

// --- Pan ---
let dragging = false, lastX = 0, lastY = 0;
wrap.addEventListener('pointerdown', e => {
  dragging = true;
  wrap.classList.add('grabbing');
  lastX = e.clientX; lastY = e.clientY;
  wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener('pointermove', e => {
  if (!dragging) return;
  originX += e.clientX - lastX;
  originY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
wrap.addEventListener('pointerup', e => { dragging = false; wrap.classList.remove('grabbing'); });
wrap.addEventListener('pointercancel', () => { dragging = false; wrap.classList.remove('grabbing'); });

// --- Zoom (wheel / pinch) ---
function zoomAt(factor, cx, cy) {
  const newScale = Math.min(maxScale, Math.max(minScale, scale * factor));
  const ratio = newScale / scale;
  originX = cx - (cx - originX) * ratio;
  originY = cy - (cy - originY) * ratio;
  scale = newScale;
  applyTransform();
}

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  zoomAt(factor, cx, cy);
}, { passive:false });

// Basic pinch-to-zoom for touch
let pinchDist = null;
wrap.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const [t1, t2] = e.touches;
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    if (pinchDist) {
      const rect = wrap.getBoundingClientRect();
      const cx = (t1.clientX + t2.clientX) / 2 - rect.left;
      const cy = (t1.clientY + t2.clientY) / 2 - rect.top;
      zoomAt(dist / pinchDist, cx, cy);
    }
    pinchDist = dist;
  }
}, { passive:false });
wrap.addEventListener('touchend', () => { pinchDist = null; });

document.getElementById('zoomIn').onclick = () => zoomAt(1.3, wrap.clientWidth/2, wrap.clientHeight/2);
document.getElementById('zoomOut').onclick = () => zoomAt(1/1.3, wrap.clientWidth/2, wrap.clientHeight/2);
document.getElementById('zoomFit').onclick = fitToScreen;
window.addEventListener('resize', () => { if (naturalW) initialView(); });
</script>
</body>
</html>
